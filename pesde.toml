# The scope must match the pesde account the package is published from.
name = "zense/constella"
version = "0.3.2"
description = "A modular Luau toolkit for Roblox: app lifecycle, signals, cleanup, reactive state, secure networking, components, pools, zones, promises, player data and replication."
authors = ["Zense"]
license = "MIT"
repository = "https://github.com/Layfate/Constella"
includes = ["src/shared/Constella/**", "pesde.toml", "README.md", "LICENSE"]

[target]
environment = "roblox"
lib = "src/shared/Constella/init.luau"
build_files = ["src"]

[indices]
default = "https://github.com/pesde-pkg/index"
