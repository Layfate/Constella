name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  STYLUA_VERSION: v0.20.0
  SELENE_VERSION: 0.27.1
  ROJO_VERSION: v7.4.4
  LUAU_LSP_VERSION: 1.70.1
  WALLY_VERSION: v0.3.2
  PESDE_VERSION: v0.7.4+registry.0.2.3
  PESDE_ASSET: pesde-0.7.4-linux-x86_64.zip

jobs:
  checks:
    name: Format, lint and type check
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Install tools (pinned versions)
        run: |
          mkdir -p "$RUNNER_TEMP/tools" "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP/tools"
          gh release download "$STYLUA_VERSION" --repo JohnnyMorganz/StyLua --pattern 'stylua-linux-x86_64.zip'
          gh release download "$SELENE_VERSION" --repo Kampfkarren/selene --pattern "selene-${SELENE_VERSION}-linux.zip"
          gh release download "$ROJO_VERSION" --repo rojo-rbx/rojo --pattern "rojo-${ROJO_VERSION#v}-linux-x86_64.zip"
          gh release download "$LUAU_LSP_VERSION" --repo JohnnyMorganz/luau-lsp --pattern 'luau-lsp-linux-x86_64.zip'
          for archive in *.zip; do unzip -o -q "$archive" -d "$RUNNER_TEMP/bin"; done
          chmod +x "$RUNNER_TEMP/bin"/*
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          curl -fsSL -o "$RUNNER_TEMP/globalTypes.d.luau" \
            "https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/${LUAU_LSP_VERSION}/scripts/globalTypes.d.luau"

      - name: Versions
        run: |
          stylua --version
          selene --version
          rojo --version
          luau-lsp --version

      - name: Format (StyLua)
        if: always()
        run: stylua --check src tests examples benchmarks

      - name: Lint (selene)
        if: always()
        run: selene src tests examples benchmarks

      - name: Type check (luau-lsp, Roblox types)
        if: always()
        run: |
          rojo sourcemap dev.project.json --output sourcemap.json
          luau-lsp analyze \
            --platform=roblox \
            --sourcemap=sourcemap.json \
            --definitions=@roblox="$RUNNER_TEMP/globalTypes.d.luau" \
            --base-luaurc=.luaurc \
            src tests examples benchmarks

  packages:
    name: Wally and pesde packages
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Wally and pesde (pinned)
        run: |
          mkdir -p "$RUNNER_TEMP/tools" "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP/tools"
          gh release download "$WALLY_VERSION" --repo UpliftGames/wally --pattern "wally-${WALLY_VERSION}-linux.zip"
          gh release download "$PESDE_VERSION" --repo pesde-pkg/pesde --pattern "$PESDE_ASSET"
          for archive in *.zip; do unzip -o -q "$archive" -d "$RUNNER_TEMP/bin"; done
          chmod +x "$RUNNER_TEMP/bin"/*
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Packages contain only the library
        run: python3 .github/scripts/check_packages.py

  roblox-tests:
    name: Test suite on a Roblox server
    needs: checks
    runs-on: ubuntu-latest
    # One run at a time: every run publishes to the same CI place.
    concurrency:
      group: roblox-ci-place
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
      ROBLOX_UNIVERSE_ID: ${{ vars.ROBLOX_UNIVERSE_ID }}
      ROBLOX_PLACE_ID: ${{ vars.ROBLOX_PLACE_ID }}
      # ProfileStore 1.0.3, pinned by commit and hash. Third-party, so it's
      # downloaded for the test place and never committed.
      PROFILESTORE_COMMIT: 9580f7c59cd3c04808e43c92e24b9afaefba679b
      PROFILESTORE_SHA256: ad43737203688b8e88cab34ebe8c483000c157e53bfb41e35f1b49ee89d0c95f
      # Comparison libraries for the benchmarks (sleitnick/signal 2.0.3 and
      # sleitnick/trove 1.8.0), pinned the same way.
      RBXUTIL_COMMIT: 31f9120fca021e3dec275b42bc7047d626962082
      SIGNAL_SHA256: a2c3a044ad291f1b8ea7d9ab38147d0ca8807c22532a45f31f33c79b89b74124
      TROVE_SHA256: 6037d12780509f4d7b6119c437b29918f230c2b90344247d591c58179ecef4b1
    steps:
      - name: Check for the Open Cloud key
        id: key
        run: |
          # Pull requests from forks and Dependabot don't get repository secrets.
          if [ -z "$ROBLOX_API_KEY" ]; then
            echo "::notice::ROBLOX_API_KEY isn't available to this run; skipping the Roblox test suite."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.key.outputs.available == 'true'
        with:
          # The benchmarks build the pull request's base commit too.
          fetch-depth: 0

      - name: Install Rojo (pinned)
        if: steps.key.outputs.available == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          gh release download "$ROJO_VERSION" --repo rojo-rbx/rojo --pattern "rojo-${ROJO_VERSION#v}-linux-x86_64.zip"
          unzip -o -q "rojo-${ROJO_VERSION#v}-linux-x86_64.zip" -d "$RUNNER_TEMP/bin"
          chmod +x "$RUNNER_TEMP/bin/rojo"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Build the CI place (package, tests and pinned ProfileStore)
        if: steps.key.outputs.available == 'true'
        run: |
          mkdir -p build
          gh api "repos/MadStudioRoblox/ProfileStore/contents/ProfileStore.luau?ref=$PROFILESTORE_COMMIT" \
            -H "Accept: application/vnd.github.raw" > build/ProfileStore.luau
          echo "$PROFILESTORE_SHA256  build/ProfileStore.luau" | sha256sum --check
          python3 - <<'EOF'
          import json
          project = json.load(open("ci.project.json", encoding="utf-8"))
          project["tree"]["ServerStorage"]["ProfileStore"] = {"$path": "build/ProfileStore.luau"}
          json.dump(project, open("ci.generated.project.json", "w", encoding="utf-8"), indent="\t")
          EOF
          rojo build ci.generated.project.json -o build/ci.rbxl

      - name: Run the test suite on Roblox (Open Cloud)
        if: steps.key.outputs.available == 'true'
        run: python3 .github/scripts/roblox_tests.py build/ci.rbxl

      # Pull requests only: this build against the base commit, measured in
      # the same server session. Informational, so it never fails the run.
      - name: Build the benchmark place (this build and the base commit)
        if: steps.key.outputs.available == 'true' && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add --detach build/baseline "$BASE_SHA"
          mkdir -p build/libs
          for lib in signal trove; do
            gh api "repos/Sleitnick/RbxUtil/contents/modules/$lib/init.luau?ref=$RBXUTIL_COMMIT" \
              -H "Accept: application/vnd.github.raw" > "build/libs/$lib.luau"
          done
          echo "$SIGNAL_SHA256  build/libs/signal.luau" | sha256sum --check
          echo "$TROVE_SHA256  build/libs/trove.luau" | sha256sum --check
          python3 - <<'EOF'
          import json
          project = json.load(open("ci.project.json", encoding="utf-8"))
          tree = project["tree"]
          tree["ReplicatedStorage"]["Packages"]["ConstellaBaseline"] = {"$path": "build/baseline/src/shared/Constella"}
          tree["ServerStorage"]["ConstellaBenchmarks"] = {"$path": "benchmarks"}
          tree["ServerStorage"]["BenchmarkLibs"] = {
              "$className": "Folder",
              "Signal": {"$path": "build/libs/signal.luau"},
              "Trove": {"$path": "build/libs/trove.luau"},
          }
          json.dump(project, open("ci.generated.project.json", "w", encoding="utf-8"), indent="\t")
          EOF
          rojo build ci.generated.project.json -o build/bench.rbxl

      - name: Run the benchmarks on Roblox (Open Cloud)
        if: steps.key.outputs.available == 'true' && github.event_name == 'pull_request'
        continue-on-error: true
        run: python3 .github/scripts/roblox_bench.py build/bench.rbxl 5
