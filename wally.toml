[package]
# The scope must match the Wally account the package is published from.
name = "layfate/constella"
description = "A modular Luau toolkit for Roblox: app lifecycle, signals, cleanup, reactive state, secure networking, components, pools, zones, promises, player data and replication."
version = "0.3.2"
authors = ["Zense"]
license = "MIT"
repository = "https://github.com/Layfate/Constella"
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"
# Wally 0.3.2 ignores `include` and has no negated patterns, so everything
# that isn't the package is excluded by name. CI checks the package contents.
exclude = [
	".github",
	".gitattributes",
	".gitignore",
	".luaurc",
	"assets",
	"benchmarks",
	"build",
	"docs",
	"examples",
	"tests",
	"src/client",
	"src/server",
	"CHANGELOG.md",
	"CONTRIBUTING.md",
	"SECURITY.md",
	"ci.project.json",
	"ci.generated.project.json",
	"dev.project.json",
	"multiplayer.project.json",
	"pesde.toml",
	"pesde.lock",
	"rokit.toml",
	"selene.toml",
	"stylua.toml",
	"sourcemap.json",
	"Packages",
]

[dependencies]
